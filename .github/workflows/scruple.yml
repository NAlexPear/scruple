name: Scruple

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: scruple-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check with Scruple
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.0.0
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Require provider credentials
        run: test -n "$TYPESAFE_API_KEY" || { echo '::error::TYPESAFE_API_KEY is not configured'; exit 1; }
      - name: Check with Scruple
        run: pnpm scruple --format json
