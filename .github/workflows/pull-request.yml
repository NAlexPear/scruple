name: Pull Request

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contributor:
    name: Check contributor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check contributor with Vouch
        id: vouch
        uses: mitchellh/vouch/action/check-pr@d66fa29a64600490892131ad87597c30c91fcac4 # v1
        with:
          pr-number: ${{ github.event.pull_request.number }}
          require-vouch: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Require a vouched contributor
        if: steps.vouch.outputs.status == 'closed'
        run: |
          echo '::error::This contributor has not been vouched for. A maintainer can comment `vouch` on the pull request, then rerun this workflow.'
          exit 1

  scruple:
    name: Check PR with Scruple
    needs: contributor
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out trusted verification code
        uses: actions/checkout@v7
        with:
          path: trusted
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.0.0
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: pnpm
          cache-dependency-path: trusted/pnpm-lock.yaml
      - name: Install trusted dependencies
        working-directory: trusted
        run: pnpm install --frozen-lockfile
      - name: Build trusted verification code
        working-directory: trusted
        run: pnpm build
      - name: Check out pull request source
        uses: actions/checkout@v7
        with:
          path: candidate
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Reject symbolic links in pull request source
        run: |
          if git -C candidate ls-files --stage | awk '$1 == "120000" { found = 1 } END { exit !found }'; then
            echo '::error::Pull request verification does not accept symbolic links.'
            exit 1
          fi
      - name: Check pull request source with Scruple
        working-directory: candidate
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          test -n "$TYPESAFE_API_KEY" || { echo '::error::TYPESAFE_API_KEY is not configured'; exit 1; }
          node "$GITHUB_WORKSPACE/trusted/packages/cli/dist/bin.js" \
            --config "$GITHUB_WORKSPACE/trusted/scruple.config.ts" \
            --format json \
            --no-cache
